<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחולל דו״ח חברתי – התחדשות עירונית</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#F2F6F8; --panel:#ffffff; --ink:#0C2238; --muted:#5B6B7A; --line:#D6E0E6;
  --brand:#0C3058; --brand-2:#E3F2EF; --accent:#206070; --teal:#50B0A0; --teal-d:#206070; --warn:#b4532a; --warn-bg:#fbeee6;
  --ok:#2d7a46; --ok-bg:#e6f3ea; --gap:#a3361f; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Rubik',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
header.top{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:12px;padding:10px 18px;background:#0C3058;color:#fff;flex-wrap:wrap;border-bottom:4px solid var(--teal)}
header.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
header.top .sub{opacity:.7;font-size:13px}
header.top .sp{flex:1}
header.top select,header.top button{background:#16406B;border:1px solid #2B5A86;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
header.top button:hover{background:#206070}
#saveState{font-size:12px;opacity:.75;min-width:70px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 56px)}
nav.steps{background:var(--panel);border-left:1px solid var(--line);padding:14px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
nav.steps .grp{font-size:12px;color:var(--muted);margin:14px 10px 6px;font-weight:700;letter-spacing:.3px}
nav.steps button{display:flex;width:100%;align-items:center;gap:8px;text-align:right;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer}
nav.steps button:hover{background:#f0f2ef}
nav.steps button.on{background:var(--brand-2);color:var(--brand);font-weight:600;box-shadow:inset -3px 0 0 var(--teal)}
nav.steps .num{width:22px;height:22px;border-radius:50%;background:#eceeea;display:grid;place-items:center;font-size:12px;flex:none}
nav.steps button.on .num{background:var(--teal-d);color:#fff}
nav.steps .bar{margin-inline-start:auto;width:34px;height:5px;background:#eceeea;border-radius:3px;overflow:hidden;flex:none}
nav.steps .bar i{display:block;height:100%;background:var(--teal)}
main{padding:22px 28px 80px;max-width:1150px;width:100%;min-width:0}
h2.stitle{margin:0 0 4px;font-size:24px}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:17px}
.card h4{margin:14px 0 6px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;font-weight:600;color:#38423d}
.f .hint{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,td input:focus,td select:focus{outline:2px solid #9FD3C9;border-color:var(--brand)}
.src{font-size:11.5px;color:var(--muted);display:flex;gap:4px;align-items:center}
.src input{font-size:11.5px;padding:2px 6px;border:1px dashed var(--line);border-radius:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{background:#f3f5f2}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:#206070}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ai{background:#f5efe6;border-color:#e8d6bd;color:#7a4a17}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.guide{background:#f7f8f5;border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.guide summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--teal-d)}
.guide div{padding:0 16px 12px;font-size:14px}
.guide ul{margin:4px 0;padding-inline-start:20px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:right;vertical-align:top}
table.t th{font-size:12.5px;color:var(--muted);font-weight:700;background:#fafbf9;position:sticky;top:0}
table.t td input,table.t td select{width:100%;min-width:60px;border:1px solid transparent;border-radius:6px;padding:4px 5px;background:transparent}
table.t td select{min-width:100px}
table.t td input:hover,table.t td select:hover{border-color:var(--line);background:#fff}
.scroll{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--brand-2);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:22px;color:var(--teal-d)}
.kpi span{font-size:12.5px;color:#3d4a44}
.kpi.w{background:var(--warn-bg)} .kpi.w b{color:var(--warn)}
.note{padding:9px 12px;border-radius:9px;font-size:14px;margin:8px 0}
.note.warn{background:var(--warn-bg);color:#7b3317}
.note.ok{background:var(--ok-bg);color:#1f5a33}
.note.info{background:#eef3f8;color:#24425f}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;background:#eceeea;color:#444}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--warn-bg);color:var(--warn)}
#map,.map{height:380px;border-radius:10px;border:1px solid var(--line)}
.leaflet-container{font-family:inherit}
.navbtns{display:flex;justify-content:space-between;margin-top:22px}
.recs li{margin-bottom:8px;list-style:none;display:flex;gap:8px;align-items:flex-start}
.recs{padding:0}
.recs .cat{font-size:11.5px;color:var(--accent);font-weight:700}
.recs li.off span{opacity:.45;text-decoration:line-through}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photos figure{margin:0;width:170px}
.photos img{width:170px;height:115px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photos input{width:100%;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;margin-top:4px}
.gaplist li{margin:3px 0}
.modal{position:fixed;inset:0;background:rgba(10,20,16,.45);display:none;align-items:center;justify-content:center;z-index:5000}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:620px;width:94%;padding:20px;max-height:88vh;overflow:auto}
.toast{position:fixed;bottom:18px;left:18px;background:#0C3058;color:#fff;padding:10px 16px;border-radius:10px;z-index:6000;opacity:0;transition:.25s;pointer-events:none;max-width:420px}
.toast.on{opacity:1}
/* report paper */
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:46px 54px;box-shadow:0 4px 24px rgba(0,0,0,.06);font-size:15px;line-height:1.7}
.paper h1{font-size:26px;margin:0 0 6px;color:#0C3058}
.paper h2{font-size:20px;border-bottom:3px solid #50B0A0;padding-bottom:4px;margin:30px 0 10px;color:#0C3058}
.paper h3{font-size:16.5px;margin:20px 0 6px;color:#206070}
.paper table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13.5px}
.paper th,.paper td{border:1px solid #c9cfca;padding:5px 7px;text-align:right;vertical-align:top}
.paper th{background:#E3F2EF;color:#0C3058}
.paper .gap{background:#fde8e1;color:var(--gap);padding:0 4px;border-radius:3px;font-weight:600}
.paper .meta td{border:0;padding:2px 6px}
.paper .cover{border-bottom:1px solid #ccc;padding-bottom:18px;margin-bottom:10px}
.paper .small{font-size:12.5px;color:#555}
.paper img{max-width:48%;margin:4px;border-radius:4px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.steps{position:static;height:auto;display:flex;overflow-x:auto;padding:8px;gap:4px;border-left:0;border-bottom:1px solid var(--line)}
  nav.steps .grp,nav.steps .bar{display:none}
  nav.steps button{white-space:nowrap;width:auto}
  main{padding:16px 12px 60px}
  .paper{padding:22px 16px}
}
@media print{
  body{background:#fff}
  header.top,nav.steps,.noprint,.navbtns,.toast{display:none!important}
  .layout{display:block} main{padding:0;max-width:none}
  .paper{border:0;box-shadow:none;padding:0}
  .paper .gap{background:#fde8e1!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .paper h2{page-break-after:avoid} .paper table{page-break-inside:auto}
}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:0 16px}
.radio{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;background:#fff}
.radio:has(input:checked){border-color:var(--brand);background:var(--brand-2);color:var(--brand);font-weight:700}
.pill.rt{background:#0C3058;color:#fff;font-size:12.5px;padding:3px 10px}
.sugg{border-bottom:1px dashed var(--line);padding:8px 0;font-size:14px}
.sugg.used{opacity:.55}
.over{color:var(--warn);font-weight:700}
.b-ok{background:#dff0e3}.b-mid{background:#fdf0cf}.b-high{background:#f8d6cc}
.legend span{padding:2px 8px;border-radius:5px;margin-left:6px}
table.gantt td.gc{width:26px;cursor:pointer;border:1px solid #e3e6e2;background:#fff}
table.gantt td.gc.on{background:var(--teal)}
.bcard{display:flex;gap:14px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:#fff}
.bcard h4{margin:0 0 4px}.bcard ul{margin:0;padding-inline-start:18px;font-size:14px}
.bcard img{width:180px;height:120px;object-fit:cover;border-radius:6px}
.bcard .ph{width:180px;height:120px;border:1px dashed #bbb;border-radius:6px;display:grid;place-items:center;color:#999;font-size:12px;text-align:center}
.paper .big{font-size:19px;font-weight:700}
.paper .src{font-size:12px;color:#666;border-top:1px dotted #ccc;padding-top:3px}
.paper .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.paper img.hero{max-width:48%;margin:4px}
.paper figure.fig{display:inline-block;width:31%;margin:0 1% 8px 0}.paper figure.fig img{max-width:100%}
.paper table.gantt-r td{border:1px solid #ccc;padding:2px 4px}.paper table.gantt-r td.on{background:#50B0A0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper td.grp{background:#eef2ef}
.paper .b-ok,.paper .b-mid,.paper .b-high{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media (max-width:860px){.paper .two{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.bcard{flex-direction:column}}
.aflog{max-height:55vh;overflow:auto;font-size:14px}.af{padding:5px 8px;border-radius:6px;margin:3px 0}.af.ok{background:#e6f3ea}.af.err{background:#fbeee6;color:#7b3317}.af.warn{background:#fdf4dc}.af.run{background:#eef3f8}

header.top .logo{width:30px;height:30px;flex:none}
.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:180px;background:#fff}
.urlist{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:220px;overflow:auto}
.uritem{text-align:right;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.uritem:hover{background:var(--brand-2)}
.uritem i,.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:12px}
.legend i.sel{border:3px solid #0C3058;background:rgba(80,176,160,.35)}
.legend i.bld{border:2px solid #0C3058;background:#fff;border-radius:50%}
.selbox{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;background:var(--brand-2);border-right:4px solid var(--teal);border-radius:8px;padding:10px 14px;margin-top:10px}
.urpop{font-family:'Rubik',sans-serif;font-size:13px;line-height:1.5;direction:rtl;text-align:right}
.card.picker{border-top:4px solid var(--teal)}
.disclaimer{font-size:11.5px;opacity:.7}
</style>
</head>
<body>
<header class="top">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="12" width="7" height="17" rx="1" fill="#50B0A0"/><rect x="12.5" y="5" width="7" height="24" rx="1" fill="#fff"/><rect x="22" y="9" width="7" height="20" rx="1" fill="#50B0A0"/></svg><h1>מחולל דו״ח חברתי</h1><span class="sub">התחדשות עירונית · לפי מדריך 3.0 של הרשות הממשלתית<br><span class="disclaimer">כלי עזר עצמאי – אינו כלי רשמי של הרשות</span></span>
  <span class="sp"></span>
  <select id="projSel" title="פרויקטים שמורים"></select>
  <button id="bNew">+ פרויקט חדש</button>
  <button id="bDemo" title="פרויקט לדוגמה עם נתונים בדויים">דוגמה</button>
  <button id="bExport">⬇ שמירה לקובץ</button>
  <button id="bImport">⬆ טעינה</button>
  <button id="bSettings">⚙ הגדרות</button>
  <span id="saveState"></span>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</header>
<div class="layout"><nav class="steps" id="nav"></nav><main id="main"></main></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =====================================================================
   מחולל דו״ח חברתי – לפי "מדריך להכנת דו״ח חברתי במיזמי התחדשות עירונית"
   גרסה 3.0 (הרשות הממשלתית להתחדשות עירונית, 2026) ותבנית הבסיס
   ===================================================================== */
const VER='3.0';
const GUIDE_LINKS=[
  {t:'דף הפרסום של המדריך באתר הרשות (gov.il)',u:'https://www.gov.il/he/departments/publications/reports/doch_chevrati_hitchadshut_ironit',d:'הדף הרשמי'},
  {t:'מדריך גרסה 2.0 (פברואר 2021) – לעיון היסטורי',u:'https://www.gov.il/BlobFolder/reports/doch_chevrati_hitchadshut_ironit/he/hithadshut_ironit_documents_madrich_doch_chevrati_v2_final.pdf',d:'הוחלף ע״י 3.0'},
  {t:'מדריך ליזם לעבודה חברתית במיזמי פינוי־בינוי',u:'https://www.gov.il/BlobFolder/reports/madrich-leyazam-leavoda-chevratit/he/hithadshut_ironit_documents_madrich-leyazam-leavoda-chevratit.pdf',d:'מסמך משלים'},
  {t:'הנחיות לעבודה חברתית למנהלות להתחדשות עירונית',u:'https://www.gov.il/BlobFolder/reports/hanchayot_leavoda_chevratit/he/hithadshut_ironit_documents_hanchayot_leavoda_hevratit.pdf',d:'מסמך משלים'}
];
const RT=['מצב קיים','הערכת חלופות','מלא'];
const RT_LABEL={'מצב קיים':'דו״ח מצב קיים','הערכת חלופות':'היבטים חברתיים בהערכת חלופות','מלא':'דו״ח חברתי מלא'};
const STEPS=[
  {id:'project', t:'שער ופרטי הפרויקט', g:'הגדרה'},
  {id:'sources', t:'מקורות מידע', g:'דו״ח מצב קיים'},
  {id:'urban',   t:'המרחב העירוני והשכונתי', g:'דו״ח מצב קיים'},
  {id:'compound',t:'רקע על המתחם ובניינים', g:'דו״ח מצב קיים'},
  {id:'housing', t:'דיור, זיקה לנכס ונטל עלות', g:'דו״ח מצב קיים'},
  {id:'pop',     t:'אוכלוסיית המתחם', g:'דו״ח מצב קיים'},
  {id:'org',     t:'התארגנות והתקשרות', g:'דו״ח מצב קיים'},
  {id:'svc',     t:'שירותים, נגישות ותפקוד', g:'דו״ח מצב קיים'},
  {id:'survey',  t:'הסקר החברתי ושיתוף ציבור', g:'סקר ודו״ח מלא'},
  {id:'concl',   t:'מסקנות, זרקור והמלצות', g:'מסקנות והמלצות'},
  {id:'alts',    t:'הערכת חלופות', g:'מסקנות והמלצות'},
  {id:'gantt',   t:'תהליך העבודה החברתית', g:'מסקנות והמלצות'},
  {id:'summary', t:'תקציר ונספחים', g:'הפקה'},
  {id:'report',  t:'טיוטת הדו״ח וייצוא', g:'הפקה'}
];
const GUIDE={
 project:`<ul><li>המדריך (3.0) כולל: תבניות בסיס לדו״ח (מצב קיים, הערכת חלופות, מלא), מסמך מלווה וטבלה לניהול מידע חברתי במתחם.</li><li>ההנחיות חלות על תכניות שמקדמים <b>גופים ציבוריים</b> וגם על תכניות ב<b>מסלול מיסוי</b>. הדו״ח מוגש כמסמך רקע למוסדות התכנון.</li><li><b>דו״ח מצב קיים</b> – 3–5 חודשים מתחילת עבודת היועץ, ולא אחרי דו״ח המצב הקיים של עורכי התכנית.</li><li><b>הערכת חלופות</b> – בשלב בחירת החלופה, במתכונת תקציר; מוגש לראש צוות התכנון ולמנהלת (לא לרשות הממשלתית). מומלץ שהסקר החברתי ייערך לפניו.</li><li><b>דו״ח מלא</b> – מוקדם ככל האפשר אחרי שלב החלופות, רצוי בשלב עיבוד החלופה המועדפת.</li></ul>`,
 sources:`<ul><li>מקורות מוצגים ב<b>טבלה מובנית</b> שמאפשרת לבודק לראות על מה הדו״ח מבוסס ומה חסר; בנוסף – הפניה למקור בהערת שוליים לאורך הדו״ח.</li><li>חובה לערוך <b>לפחות סיור אחד</b> בשכונה.</li><li>בדו״ח המלא מתווסף שקף על הסקר החברתי.</li></ul>`,
 urban:`<ul><li><b>נתונים חברתיים במבט השוואתי</b>: א״ס/שכונה, עיר, ישראל, ובמידת האפשר המתחם (במצב קיים – הערכה כמותית או מילולית). חובה: גודל משק בית ממוצע, מדד חברתי־כלכלי, שיעור שכירות, שיעור קשישים (65+), שיעור ילדים. מקור עיקרי: הלמ״ס (מפקד 2022). יש להתייחס לחפיפה בין השכונה לאזור הסטטיסטי.</li><li><b>סוגיות חברתיות במסמכי מדיניות ותכניות מתאר</b> – תכנית מתאר כוללנית, מדיניות התחדשות, תחזוקה, תמורות, תמהיל, דיור בהישג יד, פרוגרמה.</li><li><b>מיזמי בנייה בסביבה ואוכלוסייה עתידית</b> – מיזמים בשלב מתקדם; המשמעויות החברתיות שלהם (למשל גריעת מלאי שכירות); מקרה בוחן של אוכלוסייה במיזם חדש.</li></ul>`,
 compound:`<ul><li><b>הקו הכחול</b> – מפה על רקע תצ״א עם חלקות, כתובות ויח״ד בכל מבנה, שימושים ועוגנים קהילתיים.</li><li>סך היחידות הקנייניות (דיור + מסחר/תעסוקה), סוגי המבנים, תפקוד המתחם במרחב.</li><li><b>כרטיסיות בניינים</b> (נספח): יח״ד, זיקה לנכס, רמת תחזוקה, יח״ד לא טיפוסיות. עד 10 בניינים משותפים – כרטיסייה לכל בניין; 11 ומעלה – כרטיסייה למקבצי בניינים; ובנוסף כרטיסייה מרוכזת למבנים לא טיפוסיים.</li></ul>`,
 housing:`<ul><li>שיעורי בעלות/שכירות ודיור ציבורי בהשוואה לעיר ולארץ; התפלגות הזיקה לנכס – על בסיסה נקבע יעד הראיונות לכל קבוצה.</li><li>תמהיל גודל יח״ד (30–55, 56–80, 81–105, 106–140, 141+ מ״ר) מול המלצת מינהל התכנון; דיור מכליל.</li><li>דו״ח מלא: <b>מעל 30% שכירות</b> – אפיון שוכרים, משכירים ושוק השכירות; <b>מעל 10% דיור ציבורי</b> – גודל הדירות, מלאי הדיור הציבורי בעיר ופעולות יידוע והתקשרות עם החברה המשכנת.</li><li><b>נטל עלות הדיור</b>: שכ״ד או החזר משכנתא (75% מימון, 30 שנה) מול הכנסה נטו (ברירת מחדל: עשירונים 5 ו־7, ממוצע עירוני וארצי). <b>עד 25% – סביר; 25–35% – בינוני; מעל 35% – גבוה.</b> נתוני מחיר ושכירות – משמאי התכנית.</li></ul>`,
 pop:`<ul><li>טבלה מרוכזת של אוכלוסיות ייחודיות: אזרחים ותיקים (65+; לציין במפורש 70+ כשמדובר בתמורות), אנשים עם מוגבלויות, נתמכי רווחה, דיירי דיור ציבורי.</li><li>מיפוי גורמים ודמויות מפתח; תיאור כמותני ואיכותני של מגמות והיסטוריה חברתית.</li><li>דו״ח מלא: ניתוח דמוגרפי (גודל משק בית, גילאים), אפיון חברתי־תרבותי (דת, זיקה לדת, ילידי חו״ל, תרגום), מצב סוציו־אקונומי לפי זיקה לנכס, חוסן וקשרים קהילתיים.</li></ul>`,
 org:`<ul><li>מידע רגיש – יש להקפיד על <b>ציון המקור</b> לכל נתון ולצרף אסמכתאות (כתבי הסמכה, ייפויי כוח, תצהיר שיעור התקשרות) כנספח. במסלול מיסוי היזם מממן את היועץ – הקפדה יתרה על נאמנות לעובדות.</li><li>מיפוי ברמת הבניין: הסמכת נציגויות, ייצוג משפטי, התקשרות עם יזם (סוג חוזה ואחוז).</li><li>היבטים חברתיים וכלכליים בחוזה הסופי: קרן תחזוקה ושבר, שכירות זמנית, תמורות, תמורות חלופיות לאזרחים ותיקים, ליווי נוסף.</li><li>דו״ח מלא: עמדות הדיירים כלפי המיזם והגורמים המעורבים (על בסיס הסקר).</li></ul>`,
 svc:`<ul><li>להיעזר במיפויי יועצי הפרוגרמה, הנוף והתחבורה ולהתמקד ב<b>רובד החברתי</b> – רמת השימוש בפועל, צרכים, שביעות רצון.</li><li>מוסדות ציבור – כולל הצורך ב<b>מענה חלופי בתקופת הבנייה</b>; מסחר; שטחים פתוחים ציבוריים ופרטיים.</li><li>תנועה והתניידות במרחב <b>סף הבית (עד 7 דקות הליכה)</b>: נגישות לתח״צ, בעלות על רכב, יוממות ברכב (למ״ס לא״ס), חניה, הליכתיות.</li></ul>`,
 survey:`<ul><li>שיעור הראיונות מכלל <b>היחידות הקנייניות</b> (דיור + מסחר/תעסוקה): עד 100 יח״ד – <b>50%</b>; מעל 100 – <b>35%</b>.</li><li>יעד לפי קבוצות, ביחס לשיעורן במתחם: בעלי דירה מתגוררים (ככלל מעל 35% מהראיונות), בעלי דירה לא מתגוררים, שוכרים, דיור ציבורי (ככלל פחות מ־35% כל אחת), ובעלי עסקים – בעלי הנכס ושוכריו.</li><li>בדו״ח המלא: מספר הסקרים שבוצעו מול היעד, ופריסה לפי בניינים.</li><li>שאלות חוסן מבוססות על CCRAM ומדד הקהילתיות של החברה למתנ״סים.</li></ul>`,
 concl:`<ul><li><b>סיכום ומסקנות</b>: השפעת המיזם (חיובית ושלילית), חסמים, חוזקות, צרכי האוכלוסייה העתידית – בטבלת ממצא ↔ אתגר/הזדמנות.</li><li><b>זרקור</b>: הרחבה על סוגיה ייחודית למתחם.</li><li><b>המלצות</b> בטבלה אחידה: ממצא, המלצה, מועד/שלב יישום, גורם אחראי, היכן להטמיע (ובדו״ח המלא – סטטוס הטמעה). להימנע מהמלצות "משוכפלות" – לפרט את הייחודי למתחם.</li><li>בדו״ח מצב קיים – גם <b>2–4 קריטריונים לבחינת חלופות</b>.</li></ul>`,
 alts:`מסמך במתכונת תקציר, בשלב בחירת החלופה: לכל המלצה חברתית – הביטוי התכנוני שלה, וכיצד כל חלופה נותנת או לא נותנת לה מענה; וחוות דעת היועץ. נושאים לדוגמה: תמהיל יח״ד, בחינת בינוי־פינוי, גובה בינוי מגוון, חלוקה למתחמי מימוש לפי מצב ההתקשרות, דב״י/דיור מכליל/דיור מיוחד.`,
 gantt:`גאנט מובנה לעבודה החברתית לפי לוח הזמנים התכנוני, הממצאים וסטטוס ההתארגנות, עם הרציונל ויעד הסקרים. בדו״ח המלא – סטטוס ביצוע ושינויים.`,
 summary:`<ul><li><b>תקציר – עד 250 מילים</b>, במלל חופשי, המציג את עמדת היועץ ואת המתחם, עם תמונות מייצגות.</li><li>נספחים: כרטיסיות בניינים, מסמכי התארגנות והתקשרות; בדו״ח המלא – סיכום שיתוף הציבור, תובנות מתהליך ההתארגנות, תמונות נוספות.</li></ul>`,

};

 ${listTable('policy',[{k:'name',l:'שם המסמך'},{k:'scale',l:'קנה מידה',opts:['ארצי','מחוזי','עירוני','שכונתי']},{k:'year',l:'שנת פרסום',w:70},{k:'info',l:'מידע רלוונטי',area:1},{k:'concl',l:'מסקנות',area:1}],{addL:'מסמך',noMax:1})}

</div>

 ${F('futurePop','מאפייני האוכלוסייה במיזמי בנייה חדשים (מקרה בוחן) והאוכלוסייה העתידית הצפויה','textarea',{ph:'משפחות צעירות / משפרי דיור / מצמצמי דיור…'})}${F('nearbyConcl','מסקנות חברתיות בנוגע למיזמי הבנייה','textarea')}</div>

function autoCmp(k){const t=totals(),P=S.pop,a=agg();
  if(k==='hh')return a.hhAvg??(n(P.residents)&&n(P.households)?Math.round(P.residents/P.households*10)/10:null);
  if(k==='rent')return rentRate();if(k==='eld')return pct(P.eld65,P.residents)??(a.persons?pct(a.p65,a.persons):null);if(k==='kids')return a.persons?pct(a.pKids,a.persons):null;return null;}

const CAT_COLORS={kinder:'#e07b39',school:'#c94f4f',clinic:'#2f8f9d',pharmacy:'#3a9d6b',grocery:'#8a5cc2',food:'#b98a2b',park:'#3e9b3e',worship:'#6d6d6d',community:'#d1497b',bus:'#2c6fbb',rail:'#1c3f73',civic:'#7c5b3a'};
function drawMap(editable){if(typeof L==='undefined'){$('#map').innerHTML='<div class="note warn">ספריית המפה לא נטענה (נדרש חיבור לאינטרנט).</div>';return;}
  const pts=S.buildings.filter(b=>b.lat);const c=S.env.center||(pts.length?[pts.reduce((s,b)=>s+b.lat,0)/pts.length,pts.reduce((s,b)=>s+b.lng,0)/pts.length]:[32.08,34.78]);
  map=L.map('map').setView(c,pts.length?16:12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  if(S.compound.geo){try{L.geoJSON(S.compound.geo,{style:{color:'#0C3058',weight:2,dashArray:'5 4',fillColor:'#50B0A0',fillOpacity:.15}}).addTo(map).bindTooltip('גבול המתחם המוכרז');}catch(e){}}
  const grp=[];S.buildings.forEach(b=>{if(!b.lat)return;const p=pct(b.signed,b.units);const col=editable?'#c9792b':p==null?'#999':p>=66?'#2d7a46':p>=40?'#d9a21b':'#b4532a';
    grp.push(L.circleMarker([b.lat,b.lng],{radius:9,color:'#13332b',weight:2,fillColor:col,fillOpacity:.9}).addTo(map).bindTooltip(`${esc(bName(b))} · ${b.units||'?'} יח״ד${p!=null?' · '+p+'% התקשרות':''}`));});
  if(!editable&&S.env.center){[560].forEach(r=>L.circle(S.env.center,{radius:r,color:'#1f6f5c',weight:1,dashArray:'4 4',fill:false}).addTo(map).bindTooltip('סף הבית – 7 דק׳ הליכה'));
    (S.env.pois||[]).forEach(p=>L.circleMarker([p.lat,p.lng],{radius:5,color:CAT_COLORS[p.cat]||'#555',weight:1,fillOpacity:.8}).addTo(map).bindTooltip(`${esc(p.name||'ללא שם')} · ${CATS.find(c=>c.k===p.cat)?.l||''}`));}
  if(grp.length>1)map.fitBounds(L.featureGroup(grp).getBounds().pad(editable?0.4:1.2));
  if(editable)map.on('click',e=>{const b=S.buildings[selB];if(!b){toast('הוסיפו בניין תחילה');return;}b.lat=e.latlng.lat;b.lng=e.latlng.lng;b.geoErr=false;S.env.center=null;save();toast('מיקום עודכן: '+bName(b));go('compound');});
  setTimeout(()=>map&&map.invalidateSize(),150);}

async function geocodeAll(){const list=S.buildings.filter(b=>!b.lat&&(b.street||b.num));if(!list.length){toast('אין כתובות לאיתור');return;}let ok=0;
  for(const [i,b] of list.entries()){$('#geoMsg').textContent=`מאתר ${i+1}/${list.length}…`;
    try{const city=S.meta.city||'';let r=await(await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=il&limit=1&accept-language=he&street=${encodeURIComponent((b.num||'')+' '+(b.street||''))}&city=${encodeURIComponent(city)}`)).json();
      if(!r.length){await sleep(1100);r=await(await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=il&limit=1&q=${encodeURIComponent(`${b.street} ${b.num} ${city}`)}`)).json();}
      if(r.length){b.lat=+r[0].lat;b.lng=+r[0].lon;b.geoErr=false;ok++;}else b.geoErr=true;}catch(e){b.geoErr=true;}
    await sleep(1100);}
  S.env.center=null;save();go('compound');toast(`אותרו ${ok} מתוך ${list.length}`+(ok<list.length?' – את השאר מקמו בלחיצה על המפה':''),4000);}
async function fetchEnv(){const pts=S.buildings.filter(b=>b.lat);if(!pts.length)return;const c=[pts.reduce((s,b)=>s+b.lat,0)/pts.length,pts.reduce((s,b)=>s+b.lng,0)/pts.length];
  const R=n($('#radius').value)||1000;S.env.radius=R;const msg=t=>{const m=$('#envMsg');if(m)m.textContent=t;};msg('שולף שירותים מ־OpenStreetMap…');
  const q=`[out:json][timeout:60];(${CATS.map(k=>`${k.q}(around:${R},${c[0]},${c[1]});`).join('')});out center tags 600;`;let els=null;
  for(const ep of['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});if(!r.ok)throw 0;els=(await r.json()).elements||[];break;}catch(e){}}
  if(els==null){msg('⚠ שירות המפה אינו זמין כרגע – נסו שוב בעוד דקה');return;}
  const pois=els.map(e=>{const lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon,cat=classify(e.tags||{});return lat&&cat?{cat,lat,lng,name:e.tags.name||e.tags['name:he']||'',addr:[e.tags['addr:street'],e.tags['addr:housenumber']].filter(Boolean).join(' '),air:hav(c,[lat,lng])}:null}).filter(Boolean);
  const cand=[];CATS.forEach(k=>pois.filter(p=>p.cat===k.k).sort((a,b)=>a.air-b.air).slice(0,3).forEach(p=>cand.push(p)));msg(`נמצאו ${pois.length} שירותים. מחשב מרחקי הליכה…`);let mode='est';
  if(cand.length){try{const coords=[[c[1],c[0]],...cand.map(p=>[p.lng,p.lat])].map(x=>x[0].toFixed(6)+','+x[1].toFixed(6)).join(';');
    const r=await(await fetch(`https://routing.openstreetmap.de/routed-foot/table/v1/driving/${coords}?sources=0&annotations=distance`)).json();if(r.code==='Ok'){r.distances[0].slice(1).forEach((d,i)=>{cand[i].walk=d});mode='route';}}catch(e){}}
  cand.forEach(p=>{if(p.walk==null){p.walk=p.air*1.3;p.est=true;}});const summary={};
  CATS.forEach(k=>{const all=pois.filter(p=>p.cat===k.k);const best=cand.filter(p=>p.cat===k.k).sort((a,b)=>a.walk-b.walk)[0];summary[k.k]={count:all.length,name:best?(best.name||'ללא שם'):'',dist:best?best.walk:null,est:!!best?.est};});
  S.env={...S.env,pois:pois.slice(0,500),summary,center:c,fetchedAt:new Date().toISOString(),walkMode:mode};
  if(!S.src.extra.some(s=>(s.title||'').startsWith('OpenStreetMap')))S.src.extra.push({title:'OpenStreetMap (Overpass) – מיפוי שירותים',url:'https://www.openstreetmap.org',note:'נשלף '+new Date().toLocaleDateString('he-IL')});
  save();go('svc');toast('מיפוי השירותים הושלם');}

async function askClaude(task,data){
  const sys='אתה יועץ חברתי בכיר בהתחדשות עירונית בישראל, כותב דו"ח חברתי לפי מדריך הרשות הממשלתית להתחדשות עירונית, גרסה 3.0. כתוב בעברית מקצועית, ממוקדת וקונקרטית, בגוף שלישי. השתמש אך ורק בנתונים שסופקו; אל תמציא מספרים או שמות. היכן שחסר מידע כתוב [להשלמה: ...]. אל תכלול פרטים מזהים של דיירים.';
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:settings.model,max_tokens:1500,system:sys,messages:[{role:'user',content:task+'\n\nנתוני הפרויקט (JSON):\n'+JSON.stringify(data)}]})});

function buildingCards(){if(!S.buildings.length)return gap('בניינים');const t=totals();
  const typical=S.buildings.filter(b=>n(b.units)>=4&&b.btype!=='צמוד קרקע'),atyp=S.buildings.filter(b=>!(n(b.units)>=4&&b.btype!=='צמוד קרקע'));
  const card=(title,bs)=>{const u=bs.reduce((s,b)=>s+(n(b.units)||0),0);const ten=TENURE.slice(0,4).map(g=>`${g.l.split(' (')[0]} ${fmtPct(pct(bs.reduce((s,b)=>s+(n(b[g.k])||0),0),u))}`).join(' · ');
    const m=bs.map(b=>n(b.maint)).filter(v=>v!=null);const ph=S.photos.filter(p=>bs.some(b=>bName(b)===p.bld)).slice(0,2);
    return `<div class="bcard"><div><h4>${esc(title)}</h4><ul><li>יחידות דיור: ${u||'—'}</li><li>זיקה לנכס: ${ten}</li><li>רמת תחזוקה: ${m.length?(Math.round(m.reduce((s,x)=>s+x,0)/m.length*10)/10)+' / 5':gap('תחזוקה')}</li><li>יח״ד לא טיפוסיות: ${bs.reduce((s,b)=>s+(n(b.atypical)||0),0)}${bs.map(b=>b.atypNote).filter(Boolean).length?' – '+esc(bs.map(b=>b.atypNote).filter(Boolean).join('; ')):''}</li></ul></div>${ph.length?ph.map(p=>`<img src="${p.data}">`).join(''):'<div class="ph">תמונה עדכנית של הבניין</div>'}</div>`;};
  let h='';
  if(typical.length<=10)typical.forEach(b=>h+=card(bName(b),[b]));
  else{const grp={};typical.forEach(b=>{const k=b.street||'אחר';(grp[k]=grp[k]||[]).push(b);});Object.entries(grp).forEach(([k,bs])=>h+=card(`מקבץ: ${k} (${bs.map(b=>b.num).join(', ')})`,bs));}
  if(atyp.length)h+=card('מבנים לא טיפוסיים (צמודי קרקע ומבנים עד 4 יח״ד)',atyp);
  return h+'<p class="small">מקורות: נסחי טאבו | ארנונה | סיור במתחם</p>';}

function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);}
const fname=ext=>(('דוח חברתי – '+(S.meta.name||'')+' – '+(S.meta.reportType||'')).replace(/[\\/:*?"<>|]/g,'')+'.'+ext);
const REPORT_CSS=`body{font-family:Arial,'Assistant',sans-serif;direction:rtl;font-size:10.5pt;line-height:1.5}h1{font-size:20pt;color:#0C3058;margin:4pt 0}h2{font-size:14.5pt;color:#0C3058;border-bottom:1.5pt solid #50B0A0;margin-top:18pt}h3{font-size:12pt;color:#206070}h4{font-size:11pt}table{border-collapse:collapse;width:100%;margin:5pt 0}th,td{border:1px solid #999;padding:3pt 5pt;text-align:right;vertical-align:top}th{background:#E3F2EF}.gap{background:#fde8e1;color:#a3361f;font-weight:bold}.small,.src{font-size:8.5pt;color:#555}.meta td{border:0}.big{font-size:14pt;font-weight:bold}img{max-width:260px}.b-ok{background:#dff0e3}.b-mid{background:#fdf0cf}.b-high{background:#f8d6cc}.gantt-r td.on{background:#50B0A0}.bcard{border:1px solid #bbb;padding:6pt;margin:6pt 0}.grp{background:#eef2ef}`;

function parseCSV(txt){const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}if(f||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()));}
function importCSV(txt){const rows=parseCSV(txt.replace(/^﻿/,''));if(rows.length<2){toast('הקובץ ריק');return;}const map=rows[0].map(h=>RESP_COLS.find(c=>c.k===h.trim()||c.l===h.trim())?.k||null);let k=0;
  rows.slice(1).forEach(r=>{const o={};map.forEach((m,i)=>{if(m)o[m]=(r[i]||'').trim()});RESP_COLS.filter(c=>c.type==='num').forEach(c=>{if(o[c.k]!==undefined)o[c.k]=n(o[c.k])});S.survey.resp.push(o);k++;});save();go('survey');toast(`יובאו ${k} משיבים`);}
function resizeImg(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.72));};im.src=r.result;};r.readAsDataURL(file);});}

const R_URBAN='f65a0daf-f737-49c5-9424-d378d52104f5',R_CENSUS='9a9e085f-3bc8-41df-b15f-be0daaf99e30',R_SCHOOLS='2055063b-93e8-4d6a-b2c5-c253d18c0cf6',R_KG='75d2d6a7-edc9-4615-8e06-fc0940e384ce',R_BUS='e873e6a2-66c1-494f-a677-f5e77348edb0';

const IPLAN='https://ags.iplan.gov.il/arcgisiplan/rest/services/PlanningPublic/Xplan/MapServer';

async function jget(u,ms=30000,opt={}){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{...opt,signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);const tx=await r.text();try{return JSON.parse(tx)}catch(e){throw new Error('תשובה לא תקינה מהשרת')}}catch(e){throw new Error(e.name==='AbortError'?'פג זמן ההמתנה':e.message)}finally{clearTimeout(t);}}
const ckq=(res,q,limit=1000)=>jget(`${CK}datastore_search?resource_id=${res}&limit=${limit}${q?'&q='+encodeURIComponent(q):''}`).then(j=>j.result.records);
const agsPoint=(base,lat,lng,extra='')=>jget(`${base}/query?f=json&geometry=${lng},${lat}&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&returnGeometry=false${extra}`);
async function project(pts,inSR,outSR){if(!pts.length)return[];const g=await jget(`${GEOM}?f=json&inSR=${inSR}&outSR=${outSR}&geometries=${encodeURIComponent(JSON.stringify({geometryType:'esriGeometryPoint',geometries:pts.map(p=>({x:p[0],y:p[1]}))}))}`);return g.geometries.map(p=>[p.x,p.y]);}
async function walkDist(c,list){/* c=[lat,lng]; list items have lat,lng */if(!list.length)return;const coords=[[c[1],c[0]],...list.map(p=>[p.lng,p.lat])].map(x=>(+x[0]).toFixed(6)+','+(+x[1]).toFixed(6)).join(';');
  try{const r=await jget(`${OSRM}${coords}?sources=0&annotations=distance`,25000);if(r.code==='Ok')r.distances[0].slice(1).forEach((d,i)=>{list[i].walk=d;});}catch(e){}
  list.forEach(p=>{if(p.walk==null){p.walk=p.air*1.3;p.est=true;}});}
const trimR=o=>{const r={};for(const k in o)r[k]=typeof o[k]==='string'?o[k].trim():o[k];return r;};
function setE(path,v,filled,label){if(v==null||v==='')return;const cur=getP(path);if(has(cur))return;setP(path,v);if(label)filled.push(label);}
const cmpW=(a,b)=>a==null||b==null?'':a>b+0.5?'גבוה מ':a<b-0.5?'נמוך מ':'דומה ל';
function addSrc(title,url,note){if(!S.src.extra.some(s=>s.title===title))S.src.extra.push({title,url,note});}

async function autoFill(){
  if(!S.buildings.length){toast('הוסיפו תחילה את כתובות המתחם');return;}
  if(!S.meta.city){toast('הזינו עיר בשלב 1');return;}
  const log=[],filled=[];const city=S.meta.city.trim();
  openModal(`<h3>⚡ מילוי אוטומטי ממקורות פתוחים</h3><p class="small">ממלא רק שדות ריקים – נתונים שהזנתם לא יידרסו.</p><div id="afLog" class="aflog"></div><div class="row" style="margin-top:12px"><button class="btn pri" data-close="1" id="afClose" disabled>סגירה</button></div>`);
  const L=(st,t)=>{log.push({st,t});const el=$('#afLog');if(el)el.innerHTML=log.map(x=>`<div class="af ${x.st}">${x.st==='ok'?'✓':x.st==='err'?'✗':x.st==='warn'?'!':'…'} ${x.t}</div>`).join('');};
  const step=async(name,fn)=>{L('run',name+'…');try{const m=await fn();log.pop();L(m&&m.warn?'warn':'ok',name+(m&&m.msg?' – '+m.msg:''));}catch(e){log.pop();L('err',name+' – '+e.message);}};
  let c=null,saAttr=null,soec=null,code=null,sa=null,matched=null,cityRows=null;

  await step('איתור הכתובות במפה (OpenStreetMap)',async()=>{let n0=0;for(const b of S.buildings){if(b.lat||!(b.street||b.num))continue;
      const r=await jget(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=il&limit=1&accept-language=he&street=${encodeURIComponent((b.num||'')+' '+(b.street||''))}&city=${encodeURIComponent(city)}&addressdetails=1`);
      if(r.length){b.lat=+r[0].lat;b.lng=+r[0].lon;b.geoErr=false;n0++;const sub=r[0].address?.suburb||r[0].address?.neighbourhood;if(sub)setE('meta.neighborhood',sub,filled,'שכונה');}else b.geoErr=true;await sleep(1100);}
    const pts=S.buildings.filter(b=>b.lat);if(!pts.length)throw new Error('לא אותרה אף כתובת');c=[pts.reduce((s,b)=>s+b.lat,0)/pts.length,pts.reduce((s,b)=>s+b.lng,0)/pts.length];
    return{msg:`${pts.length}/${S.buildings.length} כתובות ממוקמות`,warn:pts.length<S.buildings.length};});
  if(!c){$('#afClose').disabled=false;save(true);return;}

  await step('שיוך לאזור סטטיסטי (הלמ״ס 2022)',async()=>{const cnt={};for(const b of S.buildings.filter(b=>b.lat)){const a=(await agsPoint(AGS_SA,b.lat,b.lng)).features?.[0]?.attributes;if(a){b.sa=a.STAT_2022;cnt[a.STAT_2022]=(cnt[a.STAT_2022]||0)+1;saAttr=saAttr||a;}}
    if(!saAttr)throw new Error('לא נמצא א״ס');sa=+Object.entries(cnt).sort((x,y)=>y[1]-x[1])[0][0];code=saAttr.SEMEL_YISHUV;setE('meta.statArea',String(sa),filled,'אזור סטטיסטי');
    return{msg:`א״ס ${Object.keys(cnt).join(', ')} (רובע ${saAttr.ROVA}, תת־רובע ${saAttr.TAT_ROVA})`};});

  await step('מדד חברתי־כלכלי 2021 לפי א״ס',async()=>{soec=(await agsPoint(AGS_SOEC,c[0],c[1])).features?.[0]?.attributes;if(!soec)return{msg:'לא נמצא',warn:1};
    S.urban.cmp.ses=S.urban.cmp.ses||{};setE('urban.cmp.ses.sa',soec.eshkol_mad+' (2021)',filled,'אשכול חברתי־כלכלי');return{msg:`אשכול ${soec.eshkol_mad}`};});

  await step('מפקד 2022 – א״ס, עיר וכלל ארצי (data.gov.il)',async()=>{
    cityRows=(await ckq(R_CENSUS,city,400)).filter(x=>!code||+x.LocalityCode===+code);const saRow=cityRows.find(x=>+x.StatArea===+sa),ctRow=cityRows.find(x=>x.StatArea==null||x.StatArea==='');
    const ilRow=(await ckq(R_CENSUS,'כלל ארצי',10)).find(x=>/כלל ארצי/.test(x.LocNameHeb||'')&&(x.StatArea==null||x.StatArea===''));
    if(!saRow&&!ctRow)throw new Error('לא נמצאו נתונים ליישוב');
    const put=(k,f,lab)=>{S.urban.cmp[k]=S.urban.cmp[k]||{};[['sa',saRow],['city',ctRow],['il',ilRow]].forEach(([col,row])=>{if(row&&row[f]!=null&&!has(S.urban.cmp[k][col]))S.urban.cmp[k][col]=lab?`${row[f]} ${lab}`:row[f];});};

      setE('svc.parking',`שיעור החניה (Parking_pcnt, מפקד 2022) בא״ס ${saRow.Parking_pcnt}% לעומת ${ctRow?.Parking_pcnt??'—'}% בעיר ו־${ilRow?.Parking_pcnt??'—'}% בארץ. [לאמת הגדרה ובסיור]`,filled,'חניה');
      setE('svc.carCommute',`[להשלמה: יוממות ברכב פרטי]; ${saRow.WrkOutLoc_pcnt}% מהמועסקים בא״ס עובדים מחוץ ליישוב (מפקד 2022)`,filled);
      const r=saRow,t=ctRow||{},il=ilRow||{};
      setE('urban.summary',`המתחם שוכן באזור סטטיסטי ${sa} ב${city}${saAttr?` (רובע ${saAttr.ROVA}, תת־רובע ${saAttr.TAT_ROVA})`:''}; כ־${fmtN(r.pop_approx)} תושבים וכ־${fmtN(r.hh_total_approx)} משקי בית (מפקד 2022).${soec?` הא״ס משויך לאשכול חברתי־כלכלי ${soec.eshkol_mad} (2021).`:''} שיעור המגורים בשכירות בא״ס (${r.rent_pcnt}%) ${cmpW(r.rent_pcnt,t.rent_pcnt)}העירוני (${t.rent_pcnt}%) ו${cmpW(r.rent_pcnt,il.rent_pcnt)}הארצי (${il.rent_pcnt}%). שיעור בני 65+ (${r.age65_pcnt}%) ${cmpW(r.age65_pcnt,t.age65_pcnt)}העירוני (${t.age65_pcnt}%) ו${cmpW(r.age65_pcnt,il.age65_pcnt)}הארצי (${il.age65_pcnt}%); הגיל החציוני ${r.age_median} (עיר: ${t.age_median}; ארץ: ${il.age_median}). גודל משק הבית הממוצע ${r.size_avg} (עיר: ${t.size_avg}; ארץ: ${il.size_avg}). השכר השנתי החציוני של שכירים ${fmtN(r.employeesAnnual_medWage)} ₪ (עיר: ${fmtN(t.employeesAnnual_medWage)}; ארץ: ${fmtN(il.employeesAnnual_medWage)}); בעלי תעודה אקדמית ${r.AcadmCert_pcnt}% (עיר: ${t.AcadmCert_pcnt}%). ${r.Vehicle0_pcnt}% ממשקי הבית ללא רכב. שדות נוספים במפקד (לאמת הגדרות): ילידי חו״ל מקרב היהודים ${r.j_abr_pcnt}%, עולים מאז 2002 ${r.aliya2002_pcnt}%, בני 65+ עם קושי תפקודי ${r.koshi65_pcnt}%.`,filled,'משפט מסכם על הא״ס');
      setE('urban.overlap',`הכתובות שויכו לא״ס ${sa} לפי שכבת הא״ס של הלמ״ס (2022).${totals().units&&r.hh_total_approx?` המתחם (${totals().units} יח״ד) מהווה כ־${Math.round(totals().units/r.hh_total_approx*100)}% ממשקי הבית בא״ס, ולכן נתוני הא״ס משמשים קירוב בלבד.`:''} [להשלמה: חפיפה בין שם השכונה ותפקודה לבין גבולות הא״ס]`,filled);
    }
    return{msg:`א״ס ${saRow?'✓':'—'} · עיר ${ctRow?'✓':'—'} · ארץ ${ilRow?'✓':'—'}`};});

  await step('מאגר מתחמי ההתחדשות העירונית (משרד הבינוי)',async()=>{const recs=(await ckq(R_URBAN,city,1000)).map(trimR).filter(x=>x.Yeshuv===city);
    const streets=[...new Set(S.buildings.map(b=>(b.street||'').trim()).filter(Boolean))],nums=S.buildings.map(b=>parseInt(b.num)).filter(x=>!isNaN(x));
    const score=r=>{if(S.meta.compoundId&&String(r.MisparMitham)===String(S.meta.compoundId))return 1000;const nm=r.ShemMitcham||'';if(!streets.some(s=>nm.includes(s)))return 0;let sc=1;const rng=[...nm.matchAll(/(\d+)\s*[-–]\s*(\d+)/g)].map(m=>[+m[1],+m[2]]);const single=[...nm.matchAll(/\d+/g)].map(m=>+m[0]);
      nums.forEach(n=>{if(rng.some(([a,b])=>n>=a&&n<=b)||single.includes(n))sc+=2;});return sc;};

    setE('org.process',`המתחם הוכרז כמתחם התחדשות עירונית${r.Maslul?' במסלול '+r.Maslul:''}${r.TaarichHachraza?' ב־'+r.TaarichHachraza:''} (מאגר משרד הבינוי). [להשלמה: נציגויות, ייצוג משפטי, יזמים ושיעורי התקשרות – מהמנהלת ומהנציגויות]`,filled);
    addSrc(`מאגר מתחמי התחדשות עירונית – מתחם ${r.MisparMitham}`,'https://data.gov.il/dataset/urban_renewal',`${r.Status||''}; ${r.YachadKayam||'?'} יח״ד קיימות`);
    return{msg:`נמצא: ${r.ShemMitcham} (${r.Status||''}, ${r.YachadKayam||'?'} יח״ד)`};});

  await step('תכניות בסביבה – מינהל התכנון (500 מ׳)',async()=>{const j=await agsPoint(IPLAN+'/1',c[0],c[1],'&distance=500&units=esriSRUnit_Meter');const P=(j.features||[]).map(f=>trimR(f.attributes));
    const streets=S.buildings.map(b=>(b.street||'').trim()).filter(Boolean);const ym=d=>d?new Date(d).toISOString().slice(0,7):'';
    const own=P.filter(p=>(matched&&p.pl_number===matched.MisparTochnit)||streets.some(s=>(p.pl_name||'').includes(s)&&(p.pl_name||'').match(/\d/)&&S.buildings.some(b=>(p.pl_name||'').includes(b.num))));
    const isPolicy=p=>/כוללנית|כוללת|^תמא|^תתל|מדיניות/.test((p.entity_subtype_desc||'')+' '+(p.pl_name||'')+' '+(p.pl_number||''))||(+p.quantity_delta_120>=5000);
    let np=0,nn=0;P.filter(p=>!own.includes(p)&&isPolicy(p)).forEach(p=>{if(S.policy.some(x=>(x.name||'').includes(p.pl_number)))return;const nat=/^תמא|^תתל/.test(p.pl_number||'');
      S.policy.push({name:`${p.pl_name} (${p.pl_number})`,scale:nat?'ארצי':'עירוני',year:ym(p.pl_date_8)||'בהליך',info:`${p.station_desc||p.internet_short_status||''}${+p.quantity_delta_120?`; תוספת יח״ד לפי מינהל התכנון: ${fmtN(p.quantity_delta_120)}`:''}. [להשלמה: היבטים חברתיים בתכנית]`,concl:'[להשלמה]'});np++;});
    if(np&&S.policy.some(x=>/כוללנית/.test(x.name)))setE('src.policy.master','כן',filled);if(S.policy.some(x=>/כוללת להתחדשות|מדיניות התחדשות/.test(x.name)))setE('src.policy.renewalPolicy','כן',filled);
    P.filter(p=>!own.includes(p)&&!isPolicy(p)&&(/התחדשות|מתחם|פינוי|בינוי|עיבוי/.test(p.pl_name||'')||+p.quantity_delta_120>=20)&&!/הודעה/.test(p.entity_subtype_desc||'')).slice(0,15).forEach(p=>{
      if(S.nearby.some(x=>(x.name||'').includes(p.pl_number)))return;const st=p.station_desc||p.internet_short_status||'';
      S.nearby.push({name:`${p.pl_name} (${p.pl_number}) – ${st}${/אישור/.test(st)&&p.pl_date_8?' '+ym(p.pl_date_8):''}`,kind:/התחדשות|מתחם|פינוי|בינוי|עיבוי/.test(p.pl_name||'')?'התחדשות עירונית':'בנייה חדשה',status:'תכנון',units:+p.quantity_delta_120||null,track:'',developer:'',dist:'עד 500 מ׳'});nn++;});

function urPopup(p){return `<div class="urpop"><b>${esc(p.ShemMitcham)}</b><br>${esc(p.Yeshuv)} · מתחם ${p.MisparProject}<br>מסלול: ${esc(p.TeurSugMaslul||'—')}<br>סטטוס: ${UR_STATUS[p.codeStatusHarashut]||'לא ידוע'}<br>יח״ד קיימות: ${esc(p.yachadKayamRashut||'—')} · מוצעות: ${esc(p.yachadMutzaRashut||'—')}${p.plan_name?`<br>תכנית: ${esc(p.plan_name)}`:''}<br><button class="btn pri sm" data-pickur="${p.MisparProject}" style="margin-top:6px">בחירת מתחם זה</button></div>`;}
function inRing(pt,ring){let ins=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const[xi,yi]=ring[i],[xj,yj]=ring[j];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function inGeom(lng,lat,g){if(!g)return false;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];return polys.some(p=>inRing([lng,lat],p[0])&&!p.slice(1).some(h=>inRing([lng,lat],h)));}
function urAt(lat,lng){return UR?UR.features.find(f=>inGeom(lng,lat,f.geometry)):null;}
function parseCompoundName(name){/* "ההסתדרות 197-207" / "רבי עקיבא 3-15, בר כוכבא 3-5" */const out=[];let street='';
  for(const seg of String(name||'').replace(/\s*[-–]\s*(?=\d)/g,'-').split(/[,;]| ו(?=\S+\s+\d)/)){const m=seg.trim().match(/^(.*?)(\d[\d\s\-–]*)$/);if(!m)continue;const st=m[1].replace(/[\s\-–]+$/,'').trim();if(st)street=st;if(!street)continue;
    m[2].split(/\s+/).filter(Boolean).forEach(tok=>{const r=tok.match(/^(\d+)[\-–](\d+)$/);if(r){let a=+r[1],b=+r[2];if(b<a||b-a>60)return;const step=(a%2===b%2)?2:1;for(let x=a;x<=b;x+=step)out.push({street,num:String(x)});}else if(/^\d+$/.test(tok))out.push({street,num:tok});});}
  return out.length&&out.length<=40?out:[];}
async function osmAddressesIn(geom){const ring=(geom.type==='Polygon'?geom.coordinates[0]:geom.coordinates[0][0]);const poly=ring.map(([x,y])=>`${y.toFixed(6)} ${x.toFixed(6)}`).join(' ');
  const q=`[out:json][timeout:25];(way["building"]["addr:housenumber"](poly:"${poly}");node["addr:housenumber"](poly:"${poly}"););out tags center;`;
  for(const ep of['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{const j=await jget(ep,30000,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
    const seen=new Set(),res=[];j.elements.forEach(e=>{const st=e.tags['addr:street'],nm=e.tags['addr:housenumber'];if(!st||!nm)return;const k=st+'|'+nm;if(seen.has(k))return;seen.add(k);res.push({street:st,num:nm,lat:e.lat??e.center?.lat,lng:e.lon??e.center?.lon});});

  save(true);go('project');toast(msg,5000);}

async function initPicker(){const el=$('#pmap');if(!el)return;if(typeof L==='undefined'){el.innerHTML='<div class="note warn">ספריית המפה לא נטענה (נדרש חיבור לאינטרנט).</div>';return;}
  el.innerHTML='';map=L.map('pmap',{preferCanvas:true}).setView([31.95,34.85],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap · מתחמים: משרד הבינוי והשיכון'}).addTo(map);
  const m0=map;const bl=L.layerGroup().addTo(map);S.buildings.filter(b=>b.lat).forEach(b=>L.circleMarker([b.lat,b.lng],{radius:6,color:'#0C3058',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(bl).bindTooltip(esc(bName(b))));
  map.on('click',e=>showPointPopup(e.latlng,urAt(e.latlng.lat,e.latlng.lng)));
  try{await loadUR();}catch(e){const n=document.createElement('div');n.className='note warn';n.textContent='טעינת שכבת המתחמים נכשלה ('+e.message+'). אפשר עדיין לבחור כתובות על המפה.';el.parentNode.insertBefore(n,el);return;}
  if(map!==m0)return;
  const selId=String(S.meta.compoundId||'');
  urLayer=L.geoJSON(UR,{style:f=>{const s=String(f.properties.MisparProject)===selId;return{color:s?'#0C3058':UR_COLOR[f.properties.codeStatusHarashut]||UR_COLOR[0],weight:s?3:1.5,fillOpacity:s?.35:.25,fillColor:UR_COLOR[f.properties.codeStatusHarashut]||UR_COLOR[0]};},
    onEachFeature:(f,l)=>{l.bindTooltip(`${esc(f.properties.ShemMitcham)} · ${esc(f.properties.Yeshuv)}`,{sticky:true});l.on('click',e=>{L.DomEvent.stopPropagation(e);showPointPopup(e.latlng,f);});}}).addTo(map);
  bl.bringToFront&&bl.eachLayer(x=>x.bringToFront());
  const sel=selId&&UR.features.find(f=>String(f.properties.MisparProject)===selId);
  if(sel)map.fitBounds(L.geoJSON(sel).getBounds().pad(1.2));else if(S.buildings.some(b=>b.lat))map.fitBounds(L.featureGroup(bl.getLayers()).getBounds().pad(.6));
  setTimeout(()=>map&&map.invalidateSize(),150);}
function urSearch(q){const box=$('#urList');if(!box)return;q=(q||'').trim();if(!q||!UR){box.innerHTML='';return;}const ws=q.split(/\s+/);
  const hits=UR.features.filter(f=>{const t=(f.properties.ShemMitcham||'')+' '+(f.properties.Yeshuv||'');return ws.every(w=>t.includes(w));}).slice(0,12);
  box.innerHTML=hits.length?hits.map(f=>`<button class="uritem" data-urfocus="${f.properties.MisparProject}"><i style="background:${UR_COLOR[f.properties.codeStatusHarashut]||UR_COLOR[0]}"></i><b>${esc(f.properties.ShemMitcham)}</b> · ${esc(f.properties.Yeshuv)} <span class="small">${UR_STATUS[f.properties.codeStatusHarashut]||''} · ${esc(f.properties.yachadKayamRashut||'?')} יח״ד</span></button>`).join(''):'<div class="small">לא נמצאו מתחמים</div>';}
function urFocus(id){if(!urLayer||!map)return;urLayer.eachLayer(l=>{if(String(l.feature.properties.MisparProject)===String(id)){map.fitBounds(l.getBounds().pad(1.5));L.popup().setLatLng(l.getBounds().getCenter()).setContent(urPopup(l.feature.properties)).openOn(map);}});}
async function showPointPopup(latlng,f){const m0=map;const head=f?urPopup(f.properties).replace('</div>',''):'<div class="urpop">';
  const pop=L.popup({maxWidth:300}).setLatLng(latlng).setContent(head+'<hr style="margin:6px 0">מאתר כתובת…</div>').openOn(m0);
  try{const a=await revGeocode(latlng.lat,latlng.lng);window._rev={...a,lat:latlng.lat,lng:latlng.lng};
    pop.setContent(head+`<hr style="margin:6px 0"><b>${esc(a.street||'רחוב לא מזוהה')} ${esc(a.num||'')}</b>${a.city?', '+esc(a.city):''}<br>${a.street&&a.num?'<button class="btn sm" data-addrev="1" style="margin-top:4px">+ הוספת הכתובת לרשימת הבניינים</button>':'<span class="small">לא זוהה מספר בית – לחצו על הבניין עצמו</span>'}</div>`);}
  catch(err){pop.setContent(head+'<hr style="margin:6px 0"><span class="small">איתור הכתובת נכשל</span></div>');}}
async function addrSearchGo(){const q=$('#addrSearch').value.trim();if(!q||!map)return;try{const r=await jget(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=il&limit=1&accept-language=he&addressdetails=1&q=${encodeURIComponent(q)}`);
  if(!r.length){toast('הכתובת לא נמצאה');return;}const lat=+r[0].lat,lng=+r[0].lon,a=r[0].address||{};map.setView([lat,lng],18);const f=urAt(lat,lng);
  window._rev={street:a.road||'',num:a.house_number||'',city:a.city||a.town||a.village||'',lat,lng};
  L.popup().setLatLng([lat,lng]).setContent(`<div class="urpop"><b>${esc(a.road||'')} ${esc(a.house_number||'')}</b>, ${esc(window._rev.city)}${f?`<br>בתוך מתחם: <b>${esc(f.properties.ShemMitcham)}</b> <button class="btn sm" data-pickur="${f.properties.MisparProject}">בחירת המתחם</button>`:'<br><span class="small">הכתובת אינה בתוך מתחם מוכרז</span>'}<br>${a.road&&a.house_number?'<button class="btn pri sm" data-addrev="1" style="margin-top:6px">הוספה לרשימת הבניינים</button>':''}</div>`).openOn(map);}catch(e){toast('החיפוש נכשל: '+e.message);}}
